name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      # cvitae (private) and articling (public, mirrors run-crucible) are
      # both configured under a custom SSH host alias that only resolves on
      # the site owner's machine via their local ~/.ssh/config. Rewrite it
      # to plain HTTPS so actions/checkout can reach them here.
      #
      # The credential deliberately does NOT go in this URL: checkout sets
      # http.https://github.com/.extraheader to an Authorization header and
      # propagates it to submodule fetches, and that header outranks any
      # userinfo embedded in the URL. A token spliced in here is silently
      # ignored, the job falls back to the default GITHUB_TOKEN, and the
      # private cvitae clone 404s. Passing the PAT as checkout's `token:`
      # puts it in the header that git actually uses.
      - name: Allow submodule checkout over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@hjisaac.github.com:"

      # SUBMODULES_READ_TOKEN clones this repo as well as the submodules, so
      # it needs read on hjisaac/hjisaac in addition to hjisaac/cvitae.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # PUBLIC_WEB3FORMS_ACCESS_KEY is intentionally never set here — the
      # contact form's real submit path stays structurally unreachable in
      # this build (see e2e/contact-form.spec.ts for why that's the point,
      # not a gap). PUBLIC_TRACK_VISITS=false is redundant defense-in-depth
      # for the same reason (the auto visit-tracker already no-ops without
      # a key) but costs nothing to also set explicitly.
      - run: npm run build
        env:
          PUBLIC_TRACK_VISITS: 'false'

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
